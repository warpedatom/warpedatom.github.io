<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08080a">
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/img/favicon-32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/img/favicon-16.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}">
  <link rel="manifest" href="{{ '/site.webmanifest' | relative_url }}">
  {% seo %}
  {% feed_meta %}
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://api.github.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://api.github.com; font-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self';">
  <link rel="preload" href="{{ '/assets/css/style.css' | relative_url }}" as="style">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% if page.url contains '/projects/' %}
  <link rel="preconnect" href="https://api.github.com">
  {% endif %}
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <div class="fx-topline" aria-hidden="true"></div>
  <div class="fx-skull" aria-hidden="true"></div>
  <div class="fx-grain" aria-hidden="true"></div>
  <div class="fx-vignette" aria-hidden="true"></div>

  <header class="site-header">
    <div class="wrap">
      <div class="masthead">
        <a class="brand" href="{{ '/' | relative_url }}">
          <span class="brand-mark" aria-hidden="true"></span><span class="brand-name">VELKRIS</span>
        </a>
        <nav class="nav" aria-label="Primary navigation">
          <a href="{{ '/' | relative_url }}"{% if page.url == '/' or page.url contains '/posts/' %} aria-current="page"{% endif %}>Writing</a>
          <a href="{{ '/tags/' | relative_url }}"{% if page.url contains '/tags/' %} aria-current="page"{% endif %}>Topics</a>
          <a href="{{ '/projects/' | relative_url }}"{% if page.url contains '/projects/' %} aria-current="page"{% endif %}>Projects</a>
          <a href="{{ '/about/' | relative_url }}"{% if page.url contains '/about/' %} aria-current="page"{% endif %}>About</a>
          <a href="{{ '/search/' | relative_url }}"{% if page.url contains '/search/' %} aria-current="page"{% endif %}>Search</a>
          <a href="https://github.com/{{ site.github_username | default: 'warpedatom' }}">GitHub</a>
          <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
        </nav>
      </div>
      <p class="tagline">{{ site.description }}</p>
    </div>
  </header>

  <main id="main-content" class="wrap content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>{{ site.author }}</span>
      <span class="foot-sep">/</span>
      <a href="https://github.com/{{ site.github_username | default: 'warpedatom' }}">github.com/warpedatom</a>
      <span class="foot-sep">/</span>
      <span class="foot-dim">&copy; {{ 'now' | date: "%Y" }}</span>
    </div>
  </footer>
  <script>if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js');}</script>
  <script>document.querySelectorAll('.content img').forEach(function(img){img.setAttribute('loading','lazy');});</script>
</body>
</html>
