name: CI - Build & Validate

on:
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Build Pagefind search index
        run: npx --yes pagefind@1.3.0 --site _site

      - name: Ruby dependency audit
        run: |
          gem install bundler-audit --no-document
          bundler-audit check --update

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Check HTML output
        run: |
          gem install html-proofer --no-document
          htmlproofer _site \
            --ignore-urls "/^https:\/\/x\.com/,/^https:\/\/api\.github\.com/" \
            --ignore-status-codes "403,429" \
            --no-enforce-https \
            --allow-missing-href \
            --checks "Links,Images,Scripts,OpenGraph" \
            --disable-external

      - name: Vale prose lint
        uses: errata-ai/vale-action@v3
        # TODO: pin to a SHA for supply-chain safety, e.g.:
        #   uses: errata-ai/vale-action@ede02fe6e8d8e47ced5afe00e9a6f86aed44a97f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: _posts
          version: "3.9.4"
          fail_on_error: false
