name: Site issue or correction
description: Report a broken link, typo, or rendering problem on the site.
title: "[site]: "
labels: ["site"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping keep the site clean.
  - type: input
    id: url
    attributes:
      label: Page URL
      placeholder: https://warpedatom.github.io/...
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What's wrong?
      description: Typo, broken link, layout/rendering problem, factual error, etc.
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Suggested fix (optional)
      description: If you already know the correction, drop it here.
