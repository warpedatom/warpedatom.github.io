title: "VELKRIS"
description: "Red team tradecraft, malware analysis, and evasion research."
author: "Velkris"
github_username: warpedatom
lang: en

# Production URL (custom domain - canonical for SEO and social cards)
url: "https://velkris.red"
baseurl: ""

# Social / SEO (jekyll-seo-tag)
twitter:
  username: warped_atom
  card: summary_large_image

# Build
markdown: kramdown
highlighter: rouge
permalink: /posts/:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Defaults
defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/og.png     # default social-share card
  - scope:
      path: ""
      type: posts
    values:
      layout: post

# Publish the .well-known folder (Jekyll skips dot-folders by default)
include:
  - .well-known

# Keep build-only files out of the published site
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - README.md
