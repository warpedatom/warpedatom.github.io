title: "VELKRIS"
description: "Red team tradecraft, malware analysis, and evasion research."
author: "Velkris"
github_username: warpedatom
lang: en

# Production URL (custom domain - canonical for SEO and social cards)
url: "https://velkris.red"
baseurl: ""

# Social / SEO (jekyll-seo-tag)
twitter:
  username: warped_atom
  card: summary_large_image

# Analytics — GoatCounter (privacy-first, no cookies)
# Create a free account at https://www.goatcounter.com then put your code here.
goatcounter_code: velkris

# Comments — Giscus (GitHub Discussions-backed, zero tracking)
# Requires the Giscus app installed: https://github.com/apps/giscus
giscus:
  repo: "warpedatom/warpedatom.github.io"
  repo_id: "R_kgDOQL1nvw"
  category: "General"
  category_id: "DIC_kwDOQL1nv84DCHgs"

# Build
markdown: kramdown
kramdown:
  auto_ids: true
  toc_levels: "2..3"
highlighter: rouge
permalink: /posts/:year/:month/:day/:title/

# Drafts - run `jekyll serve --drafts` to preview locally
# Create draft posts in _drafts/ folder (no date prefix needed)

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-last-modified-at
  - jekyll-redirect-from

# Defaults
defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/og.png     # default social-share card
  - scope:
      path: ""
      type: posts
    values:
      layout: post

# Publish the .well-known folder (Jekyll skips dot-folders by default)
include:
  - .well-known

# Keep build-only files out of the published site
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - README.md
