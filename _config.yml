title: "VELKRIS"
description: "Offensive security research, red team notes, and malware analysis."
author: "Velkris"

# Production URL (user site - baseurl stays empty)
url: "https://warpedatom.github.io"
baseurl: ""

# Build
markdown: kramdown
highlighter: rouge
permalink: /posts/:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Give every post the theme's layout automatically
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: default

# Keep build-only files out of the published site
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - README.md
